[project]
name = "explainer-video-workshop"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "kokoro-onnx==0.4.7",
  "mlx-audio==0.5.5",
  "mlx-whisper==0.4.3",
  "numpy==2.5.3",
  # voice.py calls its eSpeak backend directly.
  "phonemizer-fork==3.3.1",
  "pillow",
  "soundfile==0.14.0",
]

[tool.uv]
package = false
# MLX runs only on Apple Silicon Macs, so the lock covers only them.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
