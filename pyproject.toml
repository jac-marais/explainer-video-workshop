[project]
name = "explainer-video-workshop"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "kokoro-onnx==0.4.7",
  # Keep the audio decoder API used by faster-whisper compatible.
  "av==16.1.0; sys_platform == 'linux'",
  "faster-whisper==1.2.1; sys_platform == 'linux'",
  "qwen-tts==0.1.1; sys_platform == 'linux'",
  "mlx-audio==0.5.5; sys_platform == 'darwin'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin'",
  "numpy==2.5.3",
  # voice.py and narrate_film.py call its eSpeak backend directly.
  "phonemizer-fork==3.3.1",
  "pillow",
  "regex==2026.9.29",
  "soundfile==0.14.0",
  "scipy==1.18.1",
  "stanza==1.15.0",
  "pypinyin>=0.55.0",
]

[tool.uv]
package = false
# Preserve the existing MLX dependency versions when resolving the CPU backend.
constraint-dependencies = [
  "huggingface-hub==2.2.0; sys_platform == 'darwin'",
  "tokenizers==0.23.3; sys_platform == 'darwin'",
  "transformers==5.19.0; sys_platform == 'darwin'",
]
# Native speech backends are selected by platform.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
