[project]
name = "explainer-video-workshop"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "kokoro-onnx==0.4.7",
  "mlx-audio==0.5.5; sys_platform == 'darwin'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin'",
  "numpy==2.5.3",
  # voice.py and narrate_film.py call its eSpeak backend directly.
  "phonemizer-fork==3.3.1",
  "pillow",
  "regex==2026.9.29",
  "soundfile==0.14.0",
  "scipy==1.18.1",
  "stanza==1.15.0",
]

[tool.uv]
package = false
# Narration runs on Apple Silicon; Linux supports rendering voiced projects.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
